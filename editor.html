<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chibi Hollow Tilemap Editor</title>
  <link rel="stylesheet" href="/styles/map-editor.css" />
</head>
<body>
  <main class="editor-shell">
    <header class="editor-topbar" aria-label="Editor controls">
      <button id="mainMenuButton" type="button" class="top-button">Main menu</button>

      <div class="editor-tabs" role="tablist" aria-label="Editor action groups">
        <span class="editor-tabs__hint" data-editor-tab-hint="previous" aria-hidden="true">LB</span>
        <button id="mapTab" type="button" role="tab" aria-label="Map" aria-selected="false" aria-controls="mapPanel" data-editor-tab="map"><span>Map</span></button>
        <button id="editTab" type="button" role="tab" aria-label="Edit" aria-selected="true" aria-controls="editPanel" data-editor-tab="edit"><span>Edit</span></button>
        <button id="viewTab" type="button" role="tab" aria-label="View" aria-selected="false" aria-controls="viewPanel" data-editor-tab="view"><span>View</span></button>
        <span class="editor-tabs__hint" data-editor-tab-hint="next" aria-hidden="true">RB</span>
      </div>

      <button id="saveLocalButton" type="button" class="save-state-button" data-save-state="clean" disabled>Saved</button>
    </header>

    <section class="workspace" aria-label="Tilemap workspace">
      <canvas id="editorCanvas" width="1152" height="512" aria-label="Tilemap canvas"></canvas>

      <aside id="editorOverlay" class="editor-overlay" aria-label="Editor action panel">
        <div class="overlay-head">
          <h1>Tilemap Editor</h1>
          <button id="hideOverlayButton" type="button" class="ghost-button">Hide</button>
        </div>

        <section id="mapPanel" class="tab-panel" role="tabpanel" aria-labelledby="mapTab" hidden>
          <div class="panel-section">
            <h2>Map setup</h2>
            <label class="field">
              <span>Registered tilemap</span>
              <select id="tilemapSelect"></select>
            </label>
            <label class="field">
              <span>Map name</span>
              <input id="nameInput" type="text" value="New Tilemap" />
            </label>
            <label class="field">
              <span>Map ID</span>
              <input id="idInput" type="text" value="new-tilemap" aria-describedby="idHint" />
            </label>
            <p id="idHint" class="hint">Use kebab-case, e.g. <code>my-map-01</code>.</p>
            <div class="field-grid">
              <label class="field"><span>Cols</span><input id="colsInput" type="number" min="1" max="120" value="36" /></label>
              <label class="field"><span>Rows</span><input id="rowsInput" type="number" min="1" max="80" value="16" /></label>
            </div>
            <div class="button-row">
              <button id="newButton" type="button">New blank</button>
              <button id="resetButton" type="button">Reload</button>
            </div>
          </div>

          <div class="panel-section">
            <h2>Local workflow</h2>
            <label class="check"><input id="autoSaveToggle" type="checkbox" checked /> <span>Auto-save local changes</span></label>
            <div class="button-row">
              <button id="previewButton" type="button">Play preview</button>
              <button id="copyButton" type="button">Copy JS</button>
            </div>
            <p class="hint"><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>S</kbd> saves. <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd> previews.</p>
          </div>

          <div class="panel-section">
            <h2>Portability</h2>
            <div class="button-row">
              <button id="exportMapButton" type="button">Export map</button>
              <button id="importMapButton" type="button">Import map</button>
            </div>
            <input id="importMapInput" type="file" accept="application/json,.json,.chibi-map" hidden />
          </div>

          <details class="source-disclosure">
            <summary>Generated source</summary>
            <textarea id="exportText" spellcheck="false" aria-label="Generated tilemap JavaScript"></textarea>
          </details>
        </section>

        <section id="editPanel" class="tab-panel" role="tabpanel" aria-labelledby="editTab">
          <div class="panel-section">
            <h2>Brushes</h2>
            <div id="brushes" class="brush-grid" role="toolbar" aria-label="Paint brushes"></div>
          </div>
          <div class="panel-section">
            <h2>History</h2>
            <div class="button-row history-controls" aria-label="Edit history controls">
              <button id="undoButton" type="button" disabled>Undo</button>
              <button id="redoButton" type="button" disabled>Redo</button>
            </div>
          </div>
        </section>

        <section id="viewPanel" class="tab-panel" role="tabpanel" aria-labelledby="viewTab" hidden>
          <div class="panel-section">
            <h2>View</h2>
            <div class="switch-stack">
              <label class="check"><input id="gridToggle" type="checkbox" checked /> <span>Grid</span></label>
              <label class="check"><input id="collisionToggle" type="checkbox" /> <span>Collision rects</span></label>
              <label class="check"><input id="floatingControlsToggle" type="checkbox" checked /> <span>Floating zoom controls</span></label>
            </div>
            <p class="hint">Wheel or pinch to zoom. Hold <kbd>Space</kbd> or middle-drag to pan.</p>
          </div>
        </section>
      </aside>

      <div id="floatingViewControls" class="floating-view-controls" aria-label="Floating viewport controls">
        <button id="zoomOutButton" type="button" aria-label="Zoom out">−</button>
        <output id="zoomReadout" aria-label="Zoom level">100%</output>
        <button id="zoomInButton" type="button" aria-label="Zoom in">+</button>
        <button id="resetViewButton" type="button">Reset</button>
        <button id="panToggleButton" type="button" aria-pressed="false">Pan</button>
      </div>

      <p id="status" class="status" role="status">Ready.</p>
    </section>
  </main>

  <script type="module" src="/src/editor/map-editor.js"></script>
</body>
</html>
