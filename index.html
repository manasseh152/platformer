<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080b11" />
  <meta name="description" content="A cozy fantasy pixel platformer. Dash, climb, and adventure through moonlit ruins." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Chibi Hollow Platformer" />
  <meta property="og:description" content="A cozy fantasy pixel platformer. Dash, climb, and adventure through moonlit ruins." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Chibi Hollow Platformer" />
  <meta name="twitter:description" content="A cozy fantasy pixel platformer. Dash, climb, and adventure through moonlit ruins." />
  <meta name="twitter:image" content="/og-image.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Chibi Hollow" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Chibi Hollow Platformer</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles/main.game.css" />
</head>
<body>
  <div id="gameShell" class="ds-game-shell">
    <canvas id="game" width="1280" height="720"></canvas>

    <section id="hud" class="ds-hud" aria-label="Run status">
      <div class="hud-topline">
        <div>
          <div class="title ds-overline">Current Level</div>
          <div id="hudLevelName" class="hud-zone">Act 01 Level 1</div>
        </div>
        <div class="hud-act">Act 01</div>
      </div>
      <div class="hud-health-row">
        <span class="hud-label">Vigor</span>
        <div id="hearts" aria-label="Health"></div>
      </div>
      <div class="hud-objective-card">
        <span class="hud-label">Objective</span>
        <div id="objective">Reach the glowing gate →</div>
      </div>
      <div class="hud-dash-card">
        <span class="hud-label">Skill</span>
        <div id="dashStatus">Dash</div>
      </div>
      <div id="speedRunHud" class="hud-speedrun-card" hidden>
        <span class="hud-label">Speed Run</span>
        <div><span id="speedRunTimer">0:00.000</span><span id="speedRunBest">Best --:--.---</span></div>
      </div>
    </section>
    <section id="message" class="ds-toast" hidden>
      <div id="messageTitle" class="big"></div>
      <div class="small"><span class="input-hint input-hint--inline" data-input-hint="restart"></span></div>
      <div id="messageSpeedRun" class="small speedrun-result" hidden></div>
      <div class="message-actions ds-action-row">
        <button id="messageNextLevelButton" class="ds-button ds-button--primary" type="button">Play Next</button>
        <button id="messageLevelSelectButton" class="secondary ds-button ds-button--secondary" type="button">Level Select</button>
        <button id="messageRestartButton" class="secondary ds-button ds-button--secondary" type="button">Restart</button>
        <button id="messageCloseButton" class="secondary ds-button ds-button--secondary" type="button" hidden>Close to Editor</button>
      </div>
    </section>
  </div>

  <div id="scene-root"></div>
  <div id="overlay-root"></div>
  <section id="hintLayer" aria-label="Controls" hidden></section>

  <script type="module" src="/src/main.game.js"></script>
</body>
</html>
